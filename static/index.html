<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Транспорт Гомеля</title>
  <link rel="stylesheet" href="style.css?v=6">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="header">
    <h1 id="title">🚏 Транспорт Гомеля</h1>
    <p id="subtitle" class="muted">Выберите, что нужно</p>
  </header>
  <main id="app"></main>
  <script>
    // Если скрипт упал — показываем причину прямо на экране
    const showErr = m => { const a = document.getElementById("app"); if (a) a.innerHTML = '<div class="notice">⚠️ Ошибка: ' + String(m).replace(/</g, "&lt;") + "</div>"; };
    window.addEventListener("error", e => showErr(e.message + " (" + String(e.filename || "").split("/").pop() + ":" + e.lineno + ")"));
    window.addEventListener("unhandledrejection", e => showErr(e.reason));
  </script>
  <script src="script.js?v=6"></script>
</body>
</html>
